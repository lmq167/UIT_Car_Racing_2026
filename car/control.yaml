%YAML:1.0
---
control_period_ms: 50 # Chu kỳ điều khiển, ms
mask_max_age_ms: 300 # Tuổi mặt nạ tối đa, ms
cmd_max_age_ms: 200 # Tuổi lệnh tối đa, ms
det_max_age_ms: 500 # Tuổi phát hiện tối đa, ms (P2)
max_speed_cms: 15 # Trần tốc độ, cm/s
cruise_cms: 15 # Tốc độ thẳng, cm/s
min_cms: 4 # Tốc độ tối thiểu khi bám làn, cm/s
lost_cms: 4 # Tốc độ giai đoạn giữ khi mất làn, cm/s
slow_per_deg: 0.1666666667 # Mức giảm tốc theo góc, cm/s/độ
steer_max_deg: 40 # Trần góc lái, độ; dương là trái
steer_rate_dps: 200 # Tốc độ đổi góc tối đa, độ/s
kp: 30 # Hệ số tỉ lệ, độ
kd: 2 # Hệ số vi phân, độ.s
scan_rows: [0.85, 0.65, 0.45] # Vị trí hàng quét theo chiều cao mặt nạ
row_weights: [0.5, 0.3, 0.2] # Trọng số tương ứng từng hàng
lane_width_frac: [0.70, 0.55, 0.40] # Bề rộng làn theo chiều rộng mặt nạ
lane_width_min_ratio: 0.6 # Tỉ lệ nhỏ nhất để ghép hai biên
lane_width_max_ratio: 1.4 # Tỉ lệ lớn nhất để ghép hai biên
center_offset_frac: 0 # Dịch tâm xe theo chiều rộng mặt nạ
min_valid_rows: 1 # Số hàng hợp lệ tối thiểu
lost_hold_ms: 300 # Hạn giữ tốc độ khi mất làn, ms
lost_stop_ms: 800 # Hạn trả góc về không khi mất làn, ms
regain_frames: 3 # Số mặt nạ hợp lệ liên tiếp để phục hồi
record_every_n: 5 # Nhịp ghi ảnh và mặt nạ, số khung; 0 = tắt ghi ảnh
yolo_every_n: 3 # Nhịp chạy YOLO, số khung (P2)
right_clip_frac: 0.99 # Ngưỡng vạch phải sát mép theo chiều rộng mặt nạ
right_lost_ms: 500 # Hạn mất vạch phải, ms; 0 = tắt
pair_mode: 0 # Chọn cặp vạch: 0 = như cũ, 1 = cặp bao quanh xe giữ liên tục giữa các hàng
pair_max_shift_frac: 0.25 # Dịch ngang tối đa của một vạch giữa hai hàng liền nhau, theo chiều rộng mặt nạ
pair_merge_frac: 0.08 # Gộp các vạch cách nhau dưới mức này trong một hàng (chỉ pair_mode=1); 0 = tắt
kd_filter_ms: 0 # Hằng thời gian lọc đạo hàm sai số, ms; 0 = tắt
obstacle_action: 2 # Vật cản: 0 = tắt, 1 = dừng, 2 = né sang trái
obstacle_hole_frac: 0.10 # Tỉ lệ lỗ tối thiểu trong mặt đường để bỏ phiếu vật cản
obstacle_pass_cm: 40 # Quãng đi thêm sau khi vật cản biến mất khỏi ảnh, gồm vùng mù ~25 cm; chỉnh bằng yaml
start_wait_green: 1 # Chờ xanh khi xuất phát, 1
vote_window: 5 # Cửa sổ bỏ phiếu, lô
vote_min: 3 # Số phiếu tối thiểu, lô
green_frames: 3 # Số lô xanh liên tiếp, lô
red_conf_min: 0.5 # Tin cậy đỏ, 1
green_conf_min: 0.5 # Tin cậy xanh, 1
off_conf_min: 0.5 # Tin cậy tắt, 1
red_box_min_area_frac: 0.0001 # Diện tích đỏ tối thiểu, W*H
green_box_min_area_frac: 0.0001 # Diện tích xanh tối thiểu, W*H
off_box_min_area_frac: 0.0001 # Diện tích tắt tối thiểu, W*H
approach_cms: 5.0 # Tốc độ tiếp cận đỏ, cm/s
red_stop_x_frac: 0.90 # Mép phải hộp đỏ để dừng, W
turn_enable: 1 # Rẽ theo biển bằng IMU và encoder; mặc định bật
turn_yaw_deg: 80 # TẠM, CHƯA ĐO: góc quay đích, độ (30–120)
turn_steer_deg: 25 # TẠM, CHƯA ĐO: góc lái cố định, độ (5 đến steer_max_deg)
turn_arm_cm: 80 # TẠM, CHƯA ĐO: quãng chờ ngã rẽ tối đa, cm (10–300)
turn_max_cm: 70 # TẠM, CHƯA ĐO: quãng đang rẽ tối đa, cm (10–200)
turn_max_ms: 8000 # TẠM, CHƯA ĐO: thời gian đang rẽ tối đa, ms (1000–20000)
