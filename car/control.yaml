%YAML:1.0
---
control_period_ms: 50 # Chu kỳ điều khiển, ms
mask_max_age_ms: 400 # Tuổi mặt nạ tối đa, ms
cmd_max_age_ms: 200 # Tuổi lệnh tối đa, ms
det_max_age_ms: 1000 # Tuổi phát hiện tối đa, ms (P2)
max_speed_cms: 20 # Trần tốc độ, cm/s
cruise_cms: 15 # Tốc độ thẳng, cm/s
min_cms: 4 # Tốc độ tối thiểu khi bám làn, cm/s
lost_cms: 4 # Tốc độ giai đoạn giữ khi mất làn, cm/s
slow_per_deg: 0.1666666667 # Mức giảm tốc theo góc, cm/s/độ
steer_max_deg: 40 # Trần góc lái, độ; dương là trái
steer_rate_dps: 200 # Tốc độ đổi góc tối đa, độ/s
kp: 35 # Hệ số tỉ lệ, độ
kd: 2 # Hệ số vi phân, độ.s
corridor_rows: 8 # TẠM, CHỈNH NGOẠI TUYẾN p0119/p0106: số hàng hành lang (2–20)
corridor_bottom_frac: 0.95 # TẠM, CHỈNH NGOẠI TUYẾN p0119/p0106: hàng gần nhất theo chiều cao mặt nạ
corridor_top_frac: 0.62 # TẠM, CHỈNH NGOẠI TUYẾN p0119/p0106: hàng xa nhất theo chiều cao mặt nạ (0 < top < bottom)
lane1_width_frac: [0.57, 0.17] # TẠM, CHỈNH NGOẠI TUYẾN p0119/p0106: bề rộng một làn [hàng gần, hàng xa] theo chiều rộng mặt nạ
two_lane_ratio: 1.5 # TẠM, CHỈNH NGOẠI TUYẾN p0119/p0106: bề rộng/kỳ vọng từ mức này là hai làn (1.2–3)
max_jump_frac: 0.08 # TẠM, CHƯA ĐO: lệch biên giữa hai hàng và dịch lookahead mỗi khung tối đa, theo chiều rộng
corridor_conf_min: 0.4 # TẠM, CHƯA ĐO: độ tin cậy hàng tối thiểu để khớp đường (0.35–1)
lookahead_frac: 0.75 # TẠM, CHƯA ĐO: hàng lookahead theo chiều cao (trong [top, bottom])
avoid_min_width_ratio: 0.75 # TẠM, CHƯA ĐO: phần trống trái vật cản tối thiểu để né, theo bề rộng một làn
center_offset_frac: 0 # Dịch tâm xe theo chiều rộng mặt nạ
min_valid_rows: 1 # Số hàng hợp lệ tối thiểu
lost_hold_ms: 300 # Hạn giữ tốc độ khi mất làn, ms
lost_stop_ms: 800 # Hạn trả góc về không khi mất làn, ms
regain_frames: 3 # Số mặt nạ hợp lệ liên tiếp để phục hồi
record_every_n: 0 # Nhịp ghi ảnh và mặt nạ, số khung; 0 = tắt ghi ảnh
yolo_every_n: 3 # Nhịp chạy YOLO, số khung (P2)
work_barrier_action: 1 # Rào công trình: 0 = tắt, 1 = rẽ trái vào đường 2 làn (dùng máy rẽ IMU, cần turn_enable 1)
work_barrier_y2_frac: 0.55 # Đáy hộp rào tối thiểu (theo chiều cao ảnh) để bắt đầu rẽ; tăng = rẽ muộn hơn
obstacle_near_w_frac: 0.10 # TẠM, CHƯA ĐO: bề rộng hộp/ảnh để bắt đầu né, miền (0,02; 0,6]
obstacle_action: 2 # Vật cản: 0 = tắt, 1 = dừng, 2 = né sang trái
obstacle_hole_ratio: 0.25 # TẠM, CHƯA ĐO: khe tối thiểu trong hành lang để nhận vật cản, theo bề rộng một làn (0–1]
obstacle_pass_cm: 85 # TẠM, CHƯA ĐO: vùng mù 25 + dài vật 50 + dư 10 sau khi vắng hộp YOLO; yaml xe thắng
start_wait_green: 1 # Chờ xanh khi xuất phát, 1
vote_window: 5 # Cửa sổ bỏ phiếu, lô
vote_min: 3 # Số phiếu tối thiểu, lô
green_frames: 3 # Số lô xanh liên tiếp, lô
red_conf_min: 0.5 # Tin cậy đỏ, 1
green_conf_min: 0.5 # Tin cậy xanh, 1
off_conf_min: 0.5 # Tin cậy tắt, 1
red_box_min_area_frac: 0.0001 # Diện tích đỏ tối thiểu, W*H
green_box_min_area_frac: 0.0001 # Diện tích xanh tối thiểu, W*H
off_box_min_area_frac: 0.0001 # Diện tích tắt tối thiểu, W*H
approach_cms: 5.0 # Tốc độ tiếp cận đỏ, cm/s
red_stop_x_frac: 0.90 # Mép phải hộp đỏ để dừng, W
imu_fallback: 0 # TẠM, CHƯA ĐO: dự phòng IMU lỗi, mặc định tắt
turn_enable: 1 # Rẽ theo biển bằng IMU và encoder; mặc định bật
turn_yaw_deg: 80 # TẠM, CHƯA ĐO: góc quay đích, độ (30–120)
turn_steer_deg: 36 # TẠM, CHƯA ĐO: góc lái cố định, độ (5 đến steer_max_deg)
turn_arm_cm: 80 # TẠM, CHƯA ĐO: quãng chờ ngã rẽ tối đa, cm (10–300)
turn_start_cm: 45 # TẠM, CHƯA ĐO: quãng từ lúc biển đủ phiếu tới lúc bắt đầu rẽ, cm (0–150)
rb_lost_cm: 30 # TẠM, CHƯA ĐO: mất phiếu round_barrier liên tục bao nhiêu cm thì xong một lần qua vòng xuyến (10–100)
rb_turn1_cm: 60 # TẠM, CHƯA ĐO: sau lần qua vòng xuyến thứ 1 đi thêm bao nhiêu cm thì rẽ TRÁI (0–400)
rb_turn2_cm: 60 # TẠM, CHƯA ĐO: sau lần qua vòng xuyến thứ 2 đi thêm bao nhiêu cm thì rẽ PHẢI (0–400)
rb_yaw_kp: 1.0 # TẠM, CHƯA ĐO: giữ hướng khi mất làn trong vòng xuyến, độ lái mỗi độ lệch (0.1–5)
rb_hold_max_cm: 150 # TẠM, CHƯA ĐO: quãng giữ hướng tối đa mỗi lần qua (20–400)
turn_max_cm: 70 # TẠM, CHƯA ĐO: quãng đang rẽ tối đa, cm (10–200)
turn_max_ms: 8000 # TẠM, CHƯA ĐO: thời gian đang rẽ tối đa, ms (1000–20000)
park_enable: 1 # TẠM, CHƯA ĐO: đỗ xe lùi song song khi thấy biển parking (Quân 11/11: mặc định BẬT; 0 = tắt; cần turn_enable 1)
park_side: -1 # TẠM: phía ô đỗ (-1 = phải, 1 = trái)
park_forward_cm: 30 # TẠM, CHƯA ĐO: quãng bám làn sau khi biển parking đủ phiếu rồi dừng để lùi, cm (0–200)
park_arc_deg: 45 # TẠM, CHƯA ĐO: góc quay cung lùi thứ nhất, độ (10–80)
park_rev_cms: 5 # TẠM, CHƯA ĐO: tốc độ lùi, cm/s (2–5; Quân 11/11: tối đa 5)
park_steer_deg: 30 # TẠM, CHƯA ĐO: góc lái khi lùi, độ (5 đến steer_max_deg)
