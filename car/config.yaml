%YAML:1.0
---
camera_pipeline: "nvarguscamerasrc sensor-mode=5 wbmode=0 ! video/x-raw(memory:NVMM),width=1280,height=720,framerate=60/1 ! nvvidconv ! video/x-raw,format=BGRx ! videoconvert ! video/x-raw,format=BGR ! appsink drop=true max-buffers=1"
fake_source: ""
camera_hz: 50
sensor_hz: 50
control_hz: 50
odometry_hz: 20
ui_hz: 5
max_speed_cms: 25.0
max_steering_deg: 20
servo_trim_deg: 0
servo_invert: 0
tof_safety_enabled: 1
tof_brake_mm: 250
tof_timeout_ms: 500
image_timeout_ms: 500
camera_resume_max_s: 2.0     # Trong (image_timeout_ms/1000, 5] s.
resume_stable_s: 2.0
soft_start_s: 1.0            # Trong [0.2, 10] s; áp dụng cả ảnh đầu tiên của auto.
tof_mapping_confirmed: 0
camera_width: 1280
camera_height: 720
smoke_min_fps: 10.0
smoke_stop_speed_cms: 1.0
smoke_servo_deg: 10
calib_speed_cms: 10.0
calib_servo_step_deg: 5
calib_servo_limit_deg: 30
calib_distance_cm: 200.0       # Quãng mỗi lượt trong (0, 300] cm, kể cả đo bán kính.
calib_position_cm: 50.0       # Đích vị trí trong (0, 100] cm.
calib_max_duration_s: 60.0    # Hạn mỗi lượt trong (0, 120] s, luồng chấp hành tự kiểm.
imu_calibration_file: "../include/sensor/bno055_calibration.txt"
imu_drift_ms: 500
yaw_axis: 2
pitch_axis: 1
roll_axis: 2
yaw_sign: 1.0
pitch_sign: 1.0
roll_sign: 1.0
log_dir: "../runs"
image_every_n: 5
jpeg_quality: 85
image_queue_size: 8
speed_filter_size: 5
enable_oled: 1
enable_display: 1
keyboard_speed_step_cms: 5.0
keyboard_steering_step_deg: 5
motor_keepalive_ms: 200
fps_report_ms: 2000
collect_fps: 3
collect_min_speed_cms: 1.0
collect_duplicate_threshold: 0.8
collect_confirm_ms: 2000
# Thứ tự: nhanh, chậm, trái, phải, dừng, ghi, xóa, thoát, mục tiêu -/+, nhịp +/-.
collect_keys: ["w", "s", "a", "d", " ", "c", "u", "esc", "[", "]", "+", "-"]
collect_luot_keys: "123456789"
tof_names: [front, rear, left, right]
